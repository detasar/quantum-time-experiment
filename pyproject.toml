[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "objective-clocks"
version = "0.1.0"
description = "Theory-first simulations for objective clock bases and persistent-record order"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "networkx>=3.3",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "matplotlib>=3.9",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
quantum = [
  "qiskit>=2.2,<3",
  "qiskit-aer>=0.17,<1",
  "qiskit-ibm-runtime>=0.46,<1",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.110",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[project.scripts]
objective-clocks = "objective_clocks.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/objective_clocks"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "qpu_gate: tests that must pass before hardware execution",
  "slow: computationally expensive tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["objective_clocks"]

[[tool.mypy.overrides]]
module = [
  "networkx",
  "networkx.*",
  "qiskit",
  "qiskit.*",
  "qiskit_aer",
  "qiskit_aer.*",
  "qiskit_ibm_runtime",
  "qiskit_ibm_runtime.*",
  "scipy",
  "scipy.*",
]
ignore_missing_imports = true
